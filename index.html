<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>興嘉課堂搶答器 V2.1</title><link rel="stylesheet" href="app.css"></head><body>
<header><div class="wrap"><div><div class="brand">⚡ 興嘉課堂搶答器 V2.1</div><div class="sub">學生端｜輸入 6 碼 PIN 加入課堂</div></div><div class="nav"><a href="teacher.html">教師登入</a><a href="admin.html">教務處管理</a></div></div></header>
<main class="wrap"><section id="join" class="loginbox card"><h1 class="title">加入搶答</h1><label>房間 PIN</label><input id="roomCode" class="field" maxlength="6" inputmode="numeric" placeholder="例如 123456"><div class="grid"><div class="span4"><label>班級</label><input id="className" class="field" placeholder="例如 307"></div><div class="span4"><label>座號</label><input id="seatNo" class="field" inputmode="numeric" placeholder="例如 12"></div><div class="span4"><label>姓名</label><input id="name" class="field" placeholder="學生姓名"></div></div><button class="btn pri" style="width:100%;margin-top:16px" onclick="joinRoom()">加入課堂</button><div id="joinMsg" style="margin-top:10px"></div></section>
<section id="room" class="hidden"><div class="grid"><div class="span8 card"><div class="row between"><div><span class="pill" id="quizTitle">課堂活動</span><span class="pill" id="status">等待中</span></div><b>PIN <span id="pin"></span></b></div><div id="wait" class="notice" style="margin-top:14px">等待老師開始…</div><div id="question"></div><div id="feedback" style="margin-top:14px"></div></div><div class="span4 card"><h2 class="title">🏆 即時排行榜</h2><div id="board" class="list"></div></div></div></section></main>
<script src="config.js"></script><script src="common.js"></script><script>
let studentId=localStorage.getItem('xj_student_id_v21')||'',roomCode='',poller=null,lastQ='';
async function joinRoom(){try{roomCode=$('roomCode').value.trim();if(roomCode.length!==6)throw new Error('請輸入 6 碼 PIN');const j=await api('joinRoom',{roomCode,className:$('className').value.trim(),seatNo:$('seatNo').value.trim(),name:$('name').value.trim(),studentId});studentId=j.studentId;localStorage.setItem('xj_student_id_v21',studentId);$('join').classList.add('hidden');$('room').classList.remove('hidden');$('pin').textContent=roomCode;await poll();poller=setInterval(poll,1000);}catch(e){$('joinMsg').innerHTML='<div class="error">'+esc(e.message)+'</div>';}}
async function poll(){try{const j=await api('roomState',{roomCode,studentId});$('quizTitle').textContent=j.quizTitle;$('status').textContent=j.room.status==='LOBBY'?'等待中':j.room.status==='LIVE'?'進行中':'已結束';renderBoard(j.leaderboard);if(j.room.status==='ENDED'){$('wait').classList.remove('hidden');$('wait').textContent='活動已結束 🎉';$('question').innerHTML='';clearInterval(poller);return;}const q=j.question;if(!q){$('wait').classList.remove('hidden');$('wait').textContent='等待老師開始…';$('question').innerHTML='';return;}$('wait').classList.add('hidden');if(lastQ!==q.questionId){$('feedback').innerHTML='';lastQ=q.questionId;}let h='<div class="qtext">'+esc(q.text)+'</div><div class="muted">'+q.seconds+' 秒｜'+q.points+' 分</div>';if(q.type==='choice'){(q.options||[]).forEach((o,i)=>h+='<button class="option" onclick="sendAnswer(\''+(i+1)+'\')">'+(i+1)+'. '+esc(o)+'</button>');}else if(q.type==='truefalse'){h+='<div class="row"><button class="btn ok" onclick="sendAnswer(\'true\')">⭕ 正確</button><button class="btn bad" onclick="sendAnswer(\'false\')">❌ 錯誤</button></div>';}else{h+='<div class="row"><input id="shortAns" class="field" style="flex:1" placeholder="輸入答案"><button class="btn pri" onclick="sendAnswer($(\'shortAns\').value)">送出</button></div>';}h+='<hr><button class="buzz" onclick="buzz()">⚡ 搶答</button><div class="muted" style="margin-top:8px">'+(j.myBuzz?'你的搶答順位：第 '+j.myBuzz+' 名':'按下後由伺服器依收到順序排序')+'</div>';$('question').innerHTML=h;}catch(e){console.warn(e);}}
async function buzz(){try{const j=await api('buzz',{roomCode,studentId});$('feedback').innerHTML='<div class="success">⚡ 搶答第 '+j.seq+' 名</div>';}catch(e){$('feedback').innerHTML='<div class="error">'+esc(e.message)+'</div>';}}
async function sendAnswer(answer){try{const j=await api('answer',{roomCode,studentId,answer});$('feedback').innerHTML=j.duplicate?'<div class="notice">本題已作答</div>':j.isCorrect?'<div class="success">答對了！＋'+j.points+' 分</div>':'<div class="error">再接再厲</div>';}catch(e){$('feedback').innerHTML='<div class="error">'+esc(e.message)+'</div>';}}
function renderBoard(data){$('board').innerHTML=(data||[]).map((x,i)=>'<div class="rank item"><span>#'+(i+1)+'</span><b>'+esc((x.className||'')+' '+(x.name||''))+'</b><strong>'+Number(x.score||0)+'</strong></div>').join('')||'<span class="muted">尚無資料</span>';}
const qp=new URLSearchParams(location.search);if(qp.get('room'))$('roomCode').value=qp.get('room');
</script></body></html>
