<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教師端｜興嘉課堂搶答器 V2.1</title><link rel="stylesheet" href="app.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head><body>
<header><div class="wrap"><div><div class="brand">👩‍🏫 興嘉課堂搶答器 V2.1</div><div class="sub">教師端｜個人題庫、共享題庫、開房、統計、歷史紀錄</div></div><div class="nav"><a href="index.html">學生端</a><a href="admin.html">教務處</a><button id="logoutBtn" class="hidden" onclick="logout()">登出</button></div></div></header>
<main class="wrap"><section id="login" class="loginbox card"><h1 class="title">教師登入</h1><label>帳號</label><input id="username" class="field" autocomplete="username"><label>密碼</label><input id="password" class="field" type="password" autocomplete="current-password"><button class="btn pri" style="width:100%;margin-top:16px" onclick="login()">登入</button><div id="loginMsg" style="margin-top:10px"></div></section>
<section id="app" class="hidden"><div class="row between" style="margin-bottom:14px"><div><b id="welcome"></b><div class="muted">登入狀態約 6 小時，逾時請重新登入。</div></div><div class="tabs"><button class="tab active" data-tab="dash" onclick="showTab('dash',this)">總覽</button><button class="tab" data-tab="bank" onclick="showTab('bank',this)">題庫</button><button class="tab" data-tab="history" onclick="showTab('history',this)">歷史紀錄</button><button class="tab" data-tab="passwordTab" onclick="showTab('passwordTab',this)">修改密碼</button></div></div>
<div id="dash"><div class="grid"><div class="span3 card"><div class="muted">可用題庫</div><div class="metric" id="mQuizzes">0</div></div><div class="span3 card"><div class="muted">活動總數</div><div class="metric" id="mRooms">0</div></div><div class="span3 card"><div class="muted">進行中</div><div class="metric" id="mActive">0</div></div><div class="span3 card"><div class="muted">名冊學生</div><div class="metric" id="mStudents">0</div></div><div class="span12 card"><h2 class="title">最近活動</h2><div id="recentRooms" class="list"></div></div></div></div>
<div id="bank" class="hidden"><div class="row between"><h2 class="title">題庫管理</h2><div class="row"><button class="btn" onclick="document.getElementById('csvFile').click()">匯入 CSV 建立新題庫</button><input id="csvFile" type="file" accept=".csv" class="hidden" onchange="importQuizCSV(this.files[0])"><button class="btn pri" onclick="newQuiz()">＋新增題庫</button></div></div><div id="quizList" class="list"></div></div>
<div id="editor" class="hidden card"><div class="row between"><h2 class="title">題庫編輯</h2><button class="btn" onclick="showTab('bank')">返回題庫</button></div><label>題庫名稱</label><input id="quizTitle" class="field"><label>說明</label><input id="quizDesc" class="field"><label>分享範圍</label><select id="quizVisibility"><option value="private">僅自己</option><option value="shared">全校共享</option></select><div class="row" style="margin:14px 0"><button class="btn" onclick="addQ('choice')">＋選擇題</button><button class="btn" onclick="addQ('truefalse')">＋是非題</button><button class="btn" onclick="addQ('short')">＋簡答題</button></div><div id="qEditor" class="list"></div><div class="stickyActions row"><button class="btn pri" onclick="saveQuiz()">儲存題庫</button></div></div>
<div id="history" class="hidden"><div class="row between"><h2 class="title">歷史紀錄</h2><button class="btn" onclick="loadHistory()">重新整理</button></div><div id="historyList" class="list"></div></div>
<div id="passwordTab" class="hidden card"><h2 class="title">修改密碼</h2><label>原密碼</label><input id="oldPw" type="password" class="field"><label>新密碼</label><input id="newPw" type="password" class="field"><button class="btn pri" style="margin-top:14px" onclick="changePw()">更新密碼</button><div id="pwMsg" style="margin-top:10px"></div></div>
</section>
<section id="live" class="hidden"><div class="row between" style="margin-bottom:12px"><button class="btn" onclick="exitLive()">← 返回教師端</button><b id="liveTitle"></b></div><div class="grid"><div class="span8 card"><div class="muted">學生加入 PIN</div><div class="room" id="livePin"></div><div id="qr"></div><hr><div id="liveQ" class="qtext">等待開始</div><div id="liveMeta"></div><div class="row" style="margin-top:14px"><button class="btn ok" onclick="roomAction('startRoom')">開始</button><button class="btn pri" onclick="roomAction('nextQuestion')">下一題</button><button class="btn" onclick="roomAction('resetBuzz')">清除搶答</button><button class="btn bad" onclick="roomAction('endRoom')">結束</button></div></div><div class="span4"><div class="card"><h2 class="title">⚡ 搶答順序</h2><div id="buzzList" class="list"></div></div><div class="card" style="margin-top:16px"><h2 class="title">🏆 排行榜</h2><div id="liveBoard" class="list"></div></div></div></div></section>
<div id="resultModal" class="hidden" style="position:fixed;inset:0;background:#0007;z-index:20;padding:3vh 3vw;overflow:auto"><div class="card" style="max-width:1100px;margin:auto"><div class="row between"><h2 class="title" id="resultTitle">活動結果</h2><div class="row"><button class="btn" onclick="exportCurrentResults()">匯出 CSV</button><button class="btn bad" onclick="$('resultModal').classList.add('hidden')">關閉</button></div></div><div id="resultBody"></div></div></div>
</main><script src="config.js"></script><script src="common.js"></script><script>
let token=localStorage.getItem('xj_teacher_token_v21')||'',me=null,currentQuizId='',editorQuestions=[],tRoom='',poller=null,currentResults=null;
function authData(){return{token};}function logout(){localStorage.removeItem('xj_teacher_token_v21');location.reload();}
async function login(){try{const j=await api('login',{username:$('username').value.trim(),password:$('password').value});token=j.token;me=j.user;localStorage.setItem('xj_teacher_token_v21',token);enter();}catch(e){$('loginMsg').innerHTML='<div class="error">'+esc(e.message)+'</div>';}}
async function restore(){if(!token)return;try{const j=await api('me',authData());me=j.user;enter();}catch(e){localStorage.removeItem('xj_teacher_token_v21');}}
function enter(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');$('welcome').textContent='您好，'+me.displayName;loadDash();loadQuizzes();}
function showTab(id,btn){['dash','bank','editor','history','passwordTab'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));if(id==='history')loadHistory();if(id==='dash')loadDash();}
async function loadDash(){try{const j=await api('dashboard',authData());$('mQuizzes').textContent=j.counts.quizzes;$('mRooms').textContent=j.counts.rooms;$('mActive').textContent=j.counts.activeRooms;$('mStudents').textContent=j.counts.students;$('recentRooms').innerHTML=(j.recentRooms||[]).map(r=>'<div class="item row between"><div><b>PIN '+esc(r.roomCode)+'</b><div class="muted">'+fmtDate(r.createdAt)+'｜'+esc(r.status)+'</div></div><button class="btn" onclick="openExistingRoom(\''+escA(r.roomCode)+'\')">開啟</button></div>').join('')||'<span class="muted">尚無活動</span>';}catch(e){console.warn(e);}}
async function loadQuizzes(){try{const j=await api('listQuizzes',authData());$('quizList').innerHTML=(j.quizzes||[]).map(q=>'<div class="item"><div class="row between"><div><b>'+esc(q.title)+'</b> '+(q.visibility==='shared'?'<span class="pill shared">全校共享</span>':'<span class="pill private">私人</span>')+'<div class="muted">'+esc(q.description||'')+'</div></div><div class="row"><button class="btn pri" onclick="openRoom(\''+q.quizId+'\')">開房</button>'+(q.canEdit?'<button class="btn" onclick="editQuiz(\''+q.quizId+'\')">編輯</button><button class="btn bad" onclick="deleteQuiz(\''+q.quizId+'\')">刪除</button>':'')+'</div></div></div>').join('')||'<div class="notice">尚無題庫，可先建立一份或使用教務處分享的題庫。</div>';}catch(e){alert(e.message);}}
function newQuiz(){currentQuizId='';$('quizTitle').value='';$('quizDesc').value='';$('quizVisibility').value='private';editorQuestions=[];renderEditor();showTab('editor');}
async function editQuiz(id){try{const j=await api('getQuiz',{...authData(),quizId:id});if(!j.canEdit)throw new Error('此共享題庫僅可使用，不能編輯');currentQuizId=id;$('quizTitle').value=j.quiz.title;$('quizDesc').value=j.quiz.description||'';$('quizVisibility').value=j.quiz.visibility||'private';editorQuestions=j.quiz.questions||[];renderEditor();showTab('editor');}catch(e){alert(e.message);}}
function addQ(type){editorQuestions.push({type,text:'',options:type==='choice'?['選項 A','選項 B','選項 C','選項 D']:[],answer:type==='truefalse'?'true':'',seconds:20,points:1000});renderEditor();}
function renderEditor(){$('qEditor').innerHTML=editorQuestions.map((q,i)=>'<div class="item"><div class="row between"><b>第 '+(i+1)+' 題｜'+esc(q.type)+'</b><button class="btn bad" onclick="editorQuestions.splice('+i+',1);renderEditor()">刪除</button></div><label>題目</label><textarea rows="2" oninput="editorQuestions['+i+'].text=this.value">'+esc(q.text)+'</textarea>'+(q.type==='choice'?'<label>選項（每行一個）</label><textarea rows="4" oninput="editorQuestions['+i+'].options=this.value.split(\'\\n\').filter(Boolean)">'+esc((q.options||[]).join('\n'))+'</textarea><label>正確答案（1、2、3、4）</label><input class="field" value="'+esc(q.answer)+'" oninput="editorQuestions['+i+'].answer=this.value">':q.type==='truefalse'?'<label>正確答案</label><select onchange="editorQuestions['+i+'].answer=this.value"><option value="true" '+(q.answer==='true'?'selected':'')+'>正確</option><option value="false" '+(q.answer==='false'?'selected':'')+'>錯誤</option></select>':'<label>標準答案</label><input class="field" value="'+esc(q.answer)+'" oninput="editorQuestions['+i+'].answer=this.value">')+'<div class="row"><div><label>秒數</label><input class="field" type="number" value="'+q.seconds+'" style="width:120px" oninput="editorQuestions['+i+'].seconds=+this.value"></div><div><label>滿分</label><input class="field" type="number" value="'+q.points+'" style="width:120px" oninput="editorQuestions['+i+'].points=+this.value"></div></div></div>').join('')||'<div class="notice">尚未新增題目。</div>';}
async function saveQuiz(){try{const j=await api('saveQuiz',{...authData(),quiz:{quizId:currentQuizId,title:$('quizTitle').value.trim(),description:$('quizDesc').value.trim(),visibility:$('quizVisibility').value,questions:editorQuestions}});currentQuizId=j.quizId;alert('題庫已儲存');await loadQuizzes();showTab('bank');}catch(e){alert(e.message);}}
async function deleteQuiz(id){if(!confirm('確定刪除此題庫？'))return;try{await api('deleteQuiz',{...authData(),quizId:id});loadQuizzes();}catch(e){alert(e.message);}}
function importQuizCSV(file){if(!file)return;const rd=new FileReader();rd.onload=()=>{const rows=parseCSV(rd.result);if(rows.length<2)return alert('CSV 沒有題目');newQuiz();editorQuestions=rows.slice(1).filter(r=>r.length).map(c=>({type:c[0]||'choice',text:c[1]||'',options:[c[2],c[3],c[4],c[5]].filter(Boolean),answer:c[6]||'',seconds:+c[7]||20,points:+c[8]||1000}));$('quizTitle').value=file.name.replace(/\.csv$/i,'');renderEditor();};rd.readAsText(file,'utf-8');}
async function openRoom(quizId){try{const j=await api('createRoom',{...authData(),quizId});openExistingRoom(j.roomCode);}catch(e){alert(e.message);}}
function openExistingRoom(code){tRoom=code;$('app').classList.add('hidden');$('live').classList.remove('hidden');$('livePin').textContent=code;$('qr').innerHTML='';new QRCode($('qr'),{text:new URL('index.html?room='+code,location.href).href,width:170,height:170});pollTeacher();clearInterval(poller);poller=setInterval(pollTeacher,1000);}
function exitLive(){clearInterval(poller);$('live').classList.add('hidden');$('app').classList.remove('hidden');loadDash();}
async function pollTeacher(){try{const j=await api('teacherRoomState',{...authData(),roomCode:tRoom});$('liveTitle').textContent=j.quizTitle;$('liveQ').textContent=j.question?j.question.text:(j.room.status==='ENDED'?'活動已結束':'等待開始');$('liveMeta').innerHTML=j.question?'<span class="pill">'+esc(j.question.type)+'</span> <span class="pill">答案：'+esc(j.question.answer)+'</span> <span class="pill">作答 '+j.answerCount+'／答對 '+j.correctCount+'</span>':'';$('buzzList').innerHTML=(j.buzzes||[]).map(b=>'<div class="item"><b>#'+b.seq+'</b> '+esc((b.student.className||'')+' '+(b.student.seatNo||'')+' '+(b.student.name||''))+'</div>').join('')||'<span class="muted">尚無搶答</span>';renderLiveBoard(j.leaderboard);}catch(e){console.warn(e);}}
function renderLiveBoard(data){$('liveBoard').innerHTML=(data||[]).map((x,i)=>'<div class="rank item"><span>#'+(i+1)+'</span><b>'+esc((x.className||'')+' '+(x.name||''))+'</b><strong>'+x.score+'</strong></div>').join('')||'<span class="muted">尚無資料</span>';}
async function roomAction(action){try{await api(action,{...authData(),roomCode:tRoom});await pollTeacher();if(action==='endRoom')await showResults(tRoom);}catch(e){alert(e.message);}}
async function loadHistory(){try{const j=await api('listHistory',authData());$('historyList').innerHTML=(j.rooms||[]).map(r=>'<div class="item row between"><div><b>'+esc(r.quizTitle)+'｜PIN '+esc(r.roomCode)+'</b><div class="muted">'+fmtDate(r.createdAt)+'｜'+esc(r.status)+'｜'+r.participantCount+' 人</div></div><div class="row"><button class="btn" onclick="openExistingRoom(\''+r.roomCode+'\')">房間</button><button class="btn pri" onclick="showResults(\''+r.roomCode+'\')">結果</button></div></div>').join('')||'<span class="muted">尚無紀錄</span>';}catch(e){alert(e.message);}}
async function showResults(code){try{const j=await api('results',{...authData(),roomCode:code});currentResults=j;$('resultTitle').textContent=j.quizTitle+'｜PIN '+code;let h='<h3>排行榜</h3><div class="tablewrap"><table class="table"><tr><th>名次</th><th>班級</th><th>座號</th><th>姓名</th><th>分數</th></tr>'+j.leaderboard.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.className)+'</td><td>'+esc(x.seatNo)+'</td><td>'+esc(x.name)+'</td><td>'+x.score+'</td></tr>').join('')+'</table></div><h3>作答明細</h3><div class="tablewrap"><table class="table"><tr><th>題號</th><th>題目</th><th>班級</th><th>座號</th><th>姓名</th><th>答案</th><th>結果</th><th>得分</th><th>時間</th></tr>'+j.answers.map(a=>'<tr><td>'+esc(a.question.no||'')+'</td><td>'+esc(a.question.text||'')+'</td><td>'+esc(a.student.className||'')+'</td><td>'+esc(a.student.seatNo||'')+'</td><td>'+esc(a.student.name||'')+'</td><td>'+esc(a.answer)+'</td><td>'+(String(a.isCorrect).toUpperCase()==='TRUE'?'✓':'✗')+'</td><td>'+esc(a.points)+'</td><td>'+fmtDate(a.answeredAt)+'</td></tr>').join('')+'</table></div>';$('resultBody').innerHTML=h;$('resultModal').classList.remove('hidden');}catch(e){alert(e.message);}}
function exportCurrentResults(){if(!currentResults)return;const rows=[['題庫','PIN','題號','題目','班級','座號','姓名','作答','是否正確','得分','作答時間']];currentResults.answers.forEach(a=>rows.push([currentResults.quizTitle,currentResults.room.roomCode,a.question.no,a.question.text,a.student.className,a.student.seatNo,a.student.name,a.answer,String(a.isCorrect).toUpperCase()==='TRUE'?'是':'否',a.points,a.answeredAt]));downloadCSV('興嘉搶答_'+currentResults.room.roomCode+'.csv',rows);}
async function changePw(){try{await api('changeMyPassword',{...authData(),oldPassword:$('oldPw').value,newPassword:$('newPw').value});$('pwMsg').innerHTML='<div class="success">密碼已更新</div>';$('oldPw').value=$('newPw').value='';}catch(e){$('pwMsg').innerHTML='<div class="error">'+esc(e.message)+'</div>';}}
restore();
</script></body></html>
