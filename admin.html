<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教務處管理｜興嘉課堂搶答器 V2.1</title><link rel="stylesheet" href="app.css"></head><body>
<header><div class="wrap"><div><div class="brand">🏫 興嘉課堂搶答器 V2.1</div><div class="sub">教務處管理端｜教師帳號、班級名冊、全校統計</div></div><div class="nav"><a href="index.html">學生端</a><a href="teacher.html">教師端</a><button id="logoutBtn" class="hidden" onclick="logout()">登出</button></div></div></header>
<main class="wrap"><section id="login" class="loginbox card"><h1 class="title">教務處登入</h1><label>管理帳號</label><input id="username" class="field" value="admin"><label>密碼</label><input id="password" class="field" type="password"><button class="btn pri" style="width:100%;margin-top:16px" onclick="login()">登入</button><div class="notice" style="margin-top:12px">首次安裝預設：admin / 1234，登入後請立即修改密碼。</div><div id="loginMsg" style="margin-top:10px"></div></section>
<section id="app" class="hidden"><div class="row between" style="margin-bottom:14px"><div><b id="welcome"></b><div class="muted">僅 role=admin 的帳號可以進入本頁。</div></div><div class="tabs"><button class="tab active" data-tab="stats" onclick="showTab('stats',this)">全校總覽</button><button class="tab" data-tab="teachers" onclick="showTab('teachers',this)">教師帳號</button><button class="tab" data-tab="classes" onclick="showTab('classes',this)">班級</button><button class="tab" data-tab="roster" onclick="showTab('roster',this)">學生名冊</button><button class="tab" data-tab="passwordTab" onclick="showTab('passwordTab',this)">修改密碼</button></div></div>
<div id="stats"><div class="grid"><div class="span4 card"><div class="muted">教師帳號</div><div class="metric" id="sTeachers">0</div></div><div class="span4 card"><div class="muted">班級</div><div class="metric" id="sClasses">0</div></div><div class="span4 card"><div class="muted">學生名冊</div><div class="metric" id="sStudents">0</div></div><div class="span4 card"><div class="muted">題庫</div><div class="metric" id="sQuizzes">0</div></div><div class="span4 card"><div class="muted">活動房間</div><div class="metric" id="sRooms">0</div></div><div class="span4 card"><div class="muted">累積作答</div><div class="metric" id="sAnswers">0</div></div></div></div>
<div id="teachers" class="hidden"><div class="grid"><div class="span4 card"><h2 class="title" id="teacherFormTitle">新增教師</h2><input type="hidden" id="teacherId"><label>帳號</label><input id="tUser" class="field" placeholder="例如 chen123"><label>顯示名稱</label><input id="tName" class="field" placeholder="例如 陳老師"><label>角色</label><select id="tRole"><option value="teacher">教師</option><option value="admin">管理者</option></select><label>密碼</label><input id="tPw" class="field" type="password" placeholder="新增必填；編輯留白則不變"><label><input id="tEnabled" type="checkbox" checked> 啟用帳號</label><div class="row" style="margin-top:14px"><button class="btn pri" onclick="saveTeacher()">儲存</button><button class="btn" onclick="clearTeacherForm()">清空</button></div></div><div class="span8 card"><div class="row between"><h2 class="title">教師帳號清單</h2><button class="btn" onclick="loadTeachers()">重新整理</button></div><div id="teacherList" class="tablewrap"></div></div></div></div>
<div id="classes" class="hidden"><div class="grid"><div class="span4 card"><h2 class="title">班級設定</h2><input type="hidden" id="classId"><label>班級名稱</label><input id="cName" class="field" placeholder="例如 307"><label>年級</label><input id="cGrade" class="field" placeholder="例如 3"><label>指定教師</label><select id="cTeacher"><option value="">未指定／全體教師可見</option></select><label><input id="cEnabled" type="checkbox" checked> 啟用班級</label><div class="row" style="margin-top:14px"><button class="btn pri" onclick="saveClass()">儲存</button><button class="btn" onclick="clearClassForm()">清空</button></div></div><div class="span8 card"><h2 class="title">班級清單</h2><div id="classList" class="tablewrap"></div></div></div></div>
<div id="roster" class="hidden"><div class="grid"><div class="span5 card"><h2 class="title">批次匯入學生</h2><p class="muted">可直接貼上 CSV，或選擇檔案。欄位：className,seatNo,name,grade。若班級＋座號已存在，會更新姓名。</p><textarea id="rosterText" rows="14" placeholder="className,seatNo,name,grade&#10;307,1,王小明,3&#10;307,2,李小華,3"></textarea><div class="row" style="margin-top:10px"><button class="btn" onclick="document.getElementById('rosterFile').click()">選擇 CSV</button><input id="rosterFile" class="hidden" type="file" accept=".csv" onchange="loadRosterFile(this.files[0])"><button class="btn pri" onclick="importRoster()">匯入名冊</button></div><div id="rosterMsg" style="margin-top:10px"></div></div><div class="span7 card"><div class="row between"><h2 class="title">學生名冊</h2><div class="row"><select id="filterClass" onchange="loadStudents()"><option value="">全部班級</option></select><button class="btn" onclick="exportRoster()">匯出 CSV</button></div></div><div id="studentList" class="tablewrap"></div></div></div></div>
<div id="passwordTab" class="hidden card"><h2 class="title">修改管理密碼</h2><label>原密碼</label><input id="oldPw" type="password" class="field"><label>新密碼</label><input id="newPw" type="password" class="field"><button class="btn pri" style="margin-top:14px" onclick="changePw()">更新密碼</button><div id="pwMsg" style="margin-top:10px"></div></div>
</section></main><script src="config.js"></script><script src="common.js"></script><script>
let token=localStorage.getItem('xj_admin_token_v21')||'',me=null,teachersCache=[],classesCache=[],studentsCache=[];const A=()=>({token});
function logout(){localStorage.removeItem('xj_admin_token_v21');location.reload();}
async function login(){try{const j=await api('login',{username:$('username').value.trim(),password:$('password').value});if(j.user.role!=='admin')throw new Error('此帳號不是教務處管理者');token=j.token;me=j.user;localStorage.setItem('xj_admin_token_v21',token);enter();}catch(e){$('loginMsg').innerHTML='<div class="error">'+esc(e.message)+'</div>';}}
async function restore(){if(!token)return;try{const j=await api('me',A());if(j.user.role!=='admin')throw new Error();me=j.user;enter();}catch(e){localStorage.removeItem('xj_admin_token_v21');}}
function enter(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');$('welcome').textContent='您好，'+me.displayName;loadStats();loadTeachers();loadClasses();loadStudents();}
function showTab(id,btn){['stats','teachers','classes','roster','passwordTab'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));if(id==='stats')loadStats();if(id==='teachers')loadTeachers();if(id==='classes')loadClasses();if(id==='roster')loadStudents();}
async function loadStats(){try{const j=await api('adminStats',A());$('sTeachers').textContent=j.teachers;$('sClasses').textContent=j.classes;$('sStudents').textContent=j.students;$('sQuizzes').textContent=j.quizzes;$('sRooms').textContent=j.rooms;$('sAnswers').textContent=j.answers;}catch(e){console.warn(e);}}
async function loadTeachers(){try{const j=await api('listTeachers',A());teachersCache=j.teachers||[];$('teacherList').innerHTML='<table class="table"><tr><th>帳號</th><th>姓名</th><th>角色</th><th>狀態</th><th>操作</th></tr>'+teachersCache.map(t=>'<tr><td>'+esc(t.username)+'</td><td>'+esc(t.displayName)+'</td><td>'+esc(t.role)+'</td><td>'+(t.enabled?'啟用':'停用')+'</td><td><button class="btn" onclick="editTeacher(\''+t.teacherId+'\')">編輯</button> '+(t.teacherId!=='admin'?'<button class="btn bad" onclick="deleteTeacher(\''+t.teacherId+'\')">刪除</button>':'')+'</td></tr>').join('')+'</table>';renderTeacherOptions();}catch(e){alert(e.message);}}
function renderTeacherOptions(){const cur=$('cTeacher').value;$('cTeacher').innerHTML='<option value="">未指定／全體教師可見</option>'+teachersCache.filter(t=>t.enabled).map(t=>'<option value="'+t.teacherId+'">'+esc(t.displayName)+'（'+esc(t.username)+'）</option>').join('');$('cTeacher').value=cur;}
function editTeacher(id){const t=teachersCache.find(x=>x.teacherId===id);if(!t)return;$('teacherId').value=t.teacherId;$('tUser').value=t.username;$('tName').value=t.displayName;$('tRole').value=t.role;$('tPw').value='';$('tEnabled').checked=t.enabled;$('teacherFormTitle').textContent='編輯教師';}
function clearTeacherForm(){$('teacherId').value='';$('tUser').value='';$('tName').value='';$('tRole').value='teacher';$('tPw').value='';$('tEnabled').checked=true;$('teacherFormTitle').textContent='新增教師';}
async function saveTeacher(){try{await api('saveTeacher',{...A(),teacher:{teacherId:$('teacherId').value,username:$('tUser').value.trim(),displayName:$('tName').value.trim(),role:$('tRole').value,password:$('tPw').value,enabled:$('tEnabled').checked}});clearTeacherForm();await loadTeachers();loadStats();}catch(e){alert(e.message);}}
async function deleteTeacher(id){if(!confirm('確定刪除此教師帳號？'))return;try{await api('deleteTeacher',{...A(),teacherId:id});loadTeachers();loadStats();}catch(e){alert(e.message);}}
async function loadClasses(){try{const j=await api('listClasses',A());classesCache=j.classes||[];$('classList').innerHTML='<table class="table"><tr><th>班級</th><th>年級</th><th>指定教師</th><th>操作</th></tr>'+classesCache.map(c=>'<tr><td>'+esc(c.className)+'</td><td>'+esc(c.grade)+'</td><td>'+esc((teachersCache.find(t=>t.teacherId===c.teacherId)||{}).displayName||'全體教師')+'</td><td><button class="btn" onclick="editClass(\''+c.classId+'\')">編輯</button> <button class="btn bad" onclick="deleteClass(\''+c.classId+'\')">刪除</button></td></tr>').join('')+'</table>';$('filterClass').innerHTML='<option value="">全部班級</option>'+classesCache.map(c=>'<option value="'+c.classId+'">'+esc(c.className)+'</option>').join('');}catch(e){alert(e.message);}}
function editClass(id){const c=classesCache.find(x=>x.classId===id);if(!c)return;$('classId').value=c.classId;$('cName').value=c.className;$('cGrade').value=c.grade;$('cTeacher').value=c.teacherId;$('cEnabled').checked=String(c.enabled).toUpperCase()!=='FALSE';}
function clearClassForm(){$('classId').value='';$('cName').value='';$('cGrade').value='';$('cTeacher').value='';$('cEnabled').checked=true;}
async function saveClass(){try{await api('saveClass',{...A(),classData:{classId:$('classId').value,className:$('cName').value.trim(),grade:$('cGrade').value.trim(),teacherId:$('cTeacher').value,enabled:$('cEnabled').checked}});clearClassForm();await loadClasses();loadStats();}catch(e){alert(e.message);}}
async function deleteClass(id){if(!confirm('刪除班級設定？學生名冊不會自動刪除。'))return;try{await api('deleteClass',{...A(),classId:id});loadClasses();loadStats();}catch(e){alert(e.message);}}
function loadRosterFile(file){if(!file)return;const r=new FileReader();r.onload=()=>{$('rosterText').value=r.result};r.readAsText(file,'utf-8');}
async function importRoster(){try{const rows=parseCSV($('rosterText').value);if(rows.length<2)throw new Error('請貼上含表頭的 CSV');const h=rows[0].map(x=>x.trim());const idx=n=>h.indexOf(n);const data=rows.slice(1).filter(r=>r.some(Boolean)).map(r=>({className:r[idx('className')]||'',seatNo:r[idx('seatNo')]||'',name:r[idx('name')]||'',grade:idx('grade')>=0?r[idx('grade')]||'':''}));const j=await api('importRoster',{...A(),rows:data});$('rosterMsg').innerHTML='<div class="success">匯入完成：新增 '+j.added+' 筆、更新 '+j.updated+' 筆</div>';await loadClasses();await loadStudents();loadStats();}catch(e){$('rosterMsg').innerHTML='<div class="error">'+esc(e.message)+'</div>';}}
async function loadStudents(){try{const j=await api('listStudents',{...A(),classId:$('filterClass')?$('filterClass').value:''});studentsCache=j.students||[];$('studentList').innerHTML='<table class="table"><tr><th>班級</th><th>座號</th><th>姓名</th><th>操作</th></tr>'+studentsCache.map(s=>'<tr><td>'+esc(s.className)+'</td><td>'+esc(s.seatNo)+'</td><td>'+esc(s.name)+'</td><td><button class="btn bad" onclick="deleteStudent(\''+s.studentId+'\')">刪除</button></td></tr>').join('')+'</table>';}catch(e){alert(e.message);}}
async function deleteStudent(id){if(!confirm('確定刪除此學生名冊資料？'))return;try{await api('deleteStudent',{...A(),studentId:id});loadStudents();loadStats();}catch(e){alert(e.message);}}
function exportRoster(){const rows=[['className','seatNo','name','grade']];studentsCache.forEach(s=>{const c=classesCache.find(x=>x.classId===s.classId)||{};rows.push([s.className,s.seatNo,s.name,c.grade||'']);});downloadCSV('興嘉學生名冊.csv',rows);}
async function changePw(){try{await api('changeMyPassword',{...A(),oldPassword:$('oldPw').value,newPassword:$('newPw').value});$('pwMsg').innerHTML='<div class="success">密碼已更新</div>';$('oldPw').value=$('newPw').value='';}catch(e){$('pwMsg').innerHTML='<div class="error">'+esc(e.message)+'</div>';}}
restore();
</script></body></html>
